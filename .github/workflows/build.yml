name: build
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir proj
          base64 -d payload.txt > proj.zip
          unzip -q proj.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: proj
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk AI-Hangout.apk
          gh release create "build-${{ github.run_number }}" AI-Hangout.apk --title "AI Hangout phase1" --notes "debug apk"

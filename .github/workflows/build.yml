name: build
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir proj
          ls -la
          best=""; bestv=-1
          for f in payload*.txt; do
            base64 -d "$f" > t.zip 2>/dev/null || continue
            v=$(unzip -p t.zip app/build.gradle.kts 2>/dev/null | grep -oP 'versionCode = \K[0-9]+' | head -1)
            v=${v:-0}
            echo "候选：$f -> versionCode $v"
            if [ "$v" -gt "$bestv" ]; then best="$f"; bestv=$v; fi
          done
          echo "使用项目文件：$best (versionCode $bestv)"
          base64 -d "$best" > proj.zip
          unzip -q proj.zip -d proj
          find proj -type f -exec touch {} +
          grep versionName proj/app/build.gradle.kts
      - name: 下载 llama.cpp
        run: git clone --depth 1 --branch b11989 https://github.com/ggml-org/llama.cpp proj/app/src/main/cpp/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装 NDK 和 CMake
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: 编译
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
        working-directory: proj
      - name: 错误摘要
        if: failure()
        run: |
          echo "=== 错误摘要 ==="
          grep -n -E "error:|FAILED:|fatal error|undefined reference|What went wrong|e: " build.log | head -40
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk AI-Hangout-v${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" AI-Hangout-v${{ github.run_number }}.apk --title "AI Hangout #${{ github.run_number }}" --notes "debug apk"
